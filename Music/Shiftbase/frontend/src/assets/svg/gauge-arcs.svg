<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 326 326" fill="none" class="gauge-svg">
  <defs>
    <filter id="radarSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.35" />
    </filter>
    <filter id="radarHalo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.2" />
    </filter>
    <filter id="gaugeBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="11" />
    </filter>
    <linearGradient id="gaugeArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffb4c8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#bd4468" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Ambient Shadow Arc -->
  <circle cx="163" cy="163" r="130" stroke="rgba(0,0,0,0.3)" stroke-width="14" stroke-dasharray="540 300" stroke-linecap="round" transform="rotate(135 163 163)" filter="url(#radarSoft)" />

  <!-- Outer Structural Ring -->
  <circle cx="163" cy="163" r="130" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="520 290" stroke-linecap="round" transform="rotate(135 163 163)" />

  <!-- Fine Inner Arc -->
  <circle cx="163" cy="163" r="118" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Active Value Wedge with Glow -->
  <circle cx="163" cy="163" r="130" stroke="url(#gaugeArcGrad)" stroke-width="6" stroke-dasharray="320 500" stroke-linecap="round" transform="rotate(135 163 163)" filter="url(#radarHalo)" />
  <circle cx="163" cy="163" r="130" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="320 500" stroke-linecap="round" transform="rotate(135 163 163)" />

  <!-- Center Origin Core -->
  <circle cx="163" cy="163" r="4" fill="#ffffff" opacity="0.9" />
  <circle cx="163" cy="163" r="8" stroke="rgba(255,255,255,0.35)" stroke-width="1" />
</svg>