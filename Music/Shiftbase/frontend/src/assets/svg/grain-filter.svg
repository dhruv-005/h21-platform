<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <filter id="cardNoise" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.54" numOctaves="3" seed="27" stitchTiles="stitch" result="turbulence" />
      <feColorMatrix type="saturate" values="0" in="turbulence" result="desaturated" />
      <feComponentTransfer in="desaturated" result="contrast">
        <feFuncR type="linear" slope="1.8" intercept="-0.25" />
        <feFuncG type="linear" slope="1.8" intercept="-0.25" />
        <feFuncB type="linear" slope="1.8" intercept="-0.25" />
        <feFuncA type="table" tableValues="0 0.52" />
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" filter="url(#cardNoise)" />
</svg>